{% extends "base.html" %}

{% block title %}Contact Us - E-Shop{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-8">
        <div class="card glass-card border-0 shadow-lg p-4 p-md-5">
            <h2 class="fw-bold text-center mb-2"><i class="fa-solid fa-envelope me-2 text-primary"></i>Get in Touch</h2>
            <p class="text-muted text-center mb-4">Have questions or feedback? Send us a message and our support team will get back to you.</p>

            <form action="{{ url_for('contact') }}" method="POST">
                <div class="mb-3">
                    <label for="name" class="form-label fw-bold">Full Name</label>
                    <input type="text" class="form-control" id="name" name="name" required placeholder="John Doe">
                </div>

                <div class="mb-3">
                    <label for="email" class="form-label fw-bold">Email Address</label>
                    <input type="email" class="form-control" id="email" name="email" required placeholder="name@example.com">
                </div>

                <div class="mb-3">
                    <label for="message" class="form-label fw-bold">Your Message</label>
                    <textarea class="form-control" id="message" name="message" rows="5" required placeholder="Type your message here..."></textarea>
                </div>

                <button type="submit" class="btn btn-primary fw-bold w-100 py-2">
                    <i class="fa-solid fa-paper-plane me-1"></i> Send Message
                </button>
            </form>

            <hr class="my-4">

            <div class="row text-center g-3">
                <div class="col-md-4">
                    <i class="fa-solid fa-location-dot text-primary fs-5 mb-1"></i>
                    <p class="small text-muted mb-0">E-Commerce HQ, Tech Park</p>
                </div>
                <div class="col-md-4">
                    <i class="fa-solid fa-phone text-primary fs-5 mb-1"></i>
                    <p class="small text-muted mb-0">+1 (800) 123-4567</p>
                </div>
                <div class="col-md-4">
                    <i class="fa-solid fa-envelope text-primary fs-5 mb-1"></i>
                    <p class="small text-muted mb-0">support@eshop.com</p>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
