{% extends "base.html" %}

{% block title %}Login - E-Shop{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-5">
        <div class="card glass-card border-0 shadow-lg p-4 mt-4">
            <h3 class="fw-bold text-center mb-4"><i class="fa-solid fa-right-to-bracket me-2 text-primary"></i>Account Login</h3>
            
            <form action="{{ url_for('login') }}" method="POST">
                <div class="mb-3">
                    <label for="email" class="form-label fw-bold">Email Address</label>
                    <input type="email" class="form-control" id="email" name="email" required placeholder="admin@gmail.com">
                </div>

                <div class="mb-3">
                    <label for="password" class="form-label fw-bold">Password</label>
                    <input type="password" class="form-control" id="password" name="password" required placeholder="admin">
                </div>

                <button type="submit" class="btn btn-primary w-100 fw-bold py-2 mt-2">Log In</button>
            </form>

            <div class="text-center mt-3">
                <small class="text-muted">Don't have an account? <a href="{{ url_for('register') }}">Register here</a></small>
            </div>
        </div>
    </div>
</div>
{% endblock %}
