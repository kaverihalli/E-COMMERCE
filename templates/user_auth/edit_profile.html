{% extends "base.html" %}

{% block title %}Edit Profile - E-Shop{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-7">
        <div class="card glass-card border-0 shadow-lg p-4">
            <h3 class="fw-bold text-center mb-4"><i class="fa-solid fa-user-pen me-2 text-primary"></i>Edit Profile</h3>

            <form action="{{ url_for('edit_profile') }}" method="POST">
                <div class="mb-3">
                    <label for="name" class="form-label fw-bold">Full Name</label>
                    <input type="text" class="form-control" id="name" name="name" value="{{ user.name }}" required>
                </div>

                <div class="mb-3">
                    <label for="email" class="form-label fw-bold">Email Address</label>
                    <input type="email" class="form-control" id="email" value="{{ user.email }}" disabled>
                    <div class="form-text">Email address cannot be modified.</div>
                </div>

                <div class="mb-3">
                    <label for="phone" class="form-label fw-bold">Phone Number</label>
                    <input type="tel" class="form-control" id="phone" name="phone" value="{{ user.phone }}" required placeholder="1234567890">
                </div>

                <div class="mb-3">
                    <label for="address" class="form-label fw-bold">Shipping / Seller Address</label>
                    <textarea class="form-control" id="address" name="address" rows="3" required>{{ user.address }}</textarea>
                </div>

                <div class="d-flex justify-content-between gap-2 mt-4">
                    <a href="{{ url_for('profile') }}" class="btn btn-outline-secondary w-50">Cancel</a>
                    <button type="submit" class="btn btn-primary fw-bold w-50">Save Changes</button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
