{% extends "base.html" %}

{% block title %}Register - E-Shop{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card glass-card border-0 shadow-lg p-4">
            <h3 class="fw-bold text-center mb-4"><i class="fa-solid fa-user-plus me-2 text-primary"></i>Create Account</h3>
            
            <form action="{{ url_for('register') }}" method="POST">
                <div class="mb-3">
                    <label for="name" class="form-label fw-bold">Full Name</label>
                    <input type="text" class="form-control" id="name" name="name" required placeholder="John Doe">
                </div>

                <div class="mb-3">
                    <label for="email" class="form-label fw-bold">Email Address</label>
                    <input type="email" class="form-control" id="email" name="email" required placeholder="user@example.com">
                </div>

                <div class="mb-3">
                    <label for="password" class="form-label fw-bold">Password</label>
                    <input type="password" class="form-control" id="password" name="password" minlength="5" required placeholder="At least 5 characters">
                </div>

                <div class="mb-3">
                    <label for="role" class="form-label fw-bold">Select Role</label>
                    <select class="form-select" id="role" name="role" required>
                        <option value="Buyer" selected>Buyer</option>
                        <option value="Seller">Seller</option>
                    </select>
                </div>

                <div class="mb-3">
                    <label for="phone" class="form-label fw-bold">Phone Number</label>
                    <input type="tel" class="form-control" id="phone" name="phone" required placeholder="1234567890">
                </div>

                <div class="mb-3">
                    <label for="address" class="form-label fw-bold">Shipping / Seller Address</label>
                    <textarea class="form-control" id="address" name="address" rows="3" required placeholder="Street, City, Zip Code"></textarea>
                </div>

                <button type="submit" class="btn btn-primary w-100 fw-bold py-2 mt-2">Register</button>
            </form>

            <div class="text-center mt-3">
                <small class="text-muted">Already have an account? <a href="{{ url_for('login') }}">Log in here</a></small>
            </div>
        </div>
    </div>
</div>
{% endblock %}
